<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KitsuPlay — Offline</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1rem;
      text-align: center;
    }
    .offline { max-width: 420px; }
    h1 { font-size: 22px; margin-bottom: 0.4rem; }
    p { color: #aaa; line-height: 1.5; margin: 0.5rem 0 1rem; }
    .home {
      display: inline-block;
      margin-top: 0.4rem;
      background: #ff2e63;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="offline">
    <h1>You're offline</h1>
    <p>KitsuPlay is available when you're back online. Your watchlist stays in the browser.</p>
    <a class="home" href="../../">Back to KitsuPlay</a>
  </div>
</body>
</html>
